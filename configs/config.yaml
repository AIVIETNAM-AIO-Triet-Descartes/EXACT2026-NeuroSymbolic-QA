llm:
  model_name: "qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
  model_path: "./models"
  device: "cuda"           # cuda | cpu | mps
  max_new_tokens: 1024
  temperature: 0.1
  do_sample: false         # deterministic output preferred for competition

pipeline:
  z3_timeout: 5            # seconds before Z3 fallback
  sympy_timeout: 10
  retry_attempts: 2

api:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  format: "json"
