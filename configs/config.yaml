llm:
  # vLLM server (OpenAI-compatible). Start server trước khi chạy pipeline:
  #   vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000 --host 0.0.0.0
  api_base: "http://localhost:8000/v1"
  api_key: "not-needed"                       # vLLM không yêu cầu auth mặc định
  model_name: "Qwen/Qwen2.5-7B-Instruct"     # phải khớp với model đang serve
  temperature: 0.1
  max_tokens: 1024

pipeline:
  z3_timeout: 5            # seconds before Z3 fallback
  sympy_timeout: 10
  retry_attempts: 2

api:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  format: "json"
